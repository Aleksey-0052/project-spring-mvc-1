version: "3.8"

services:

  db_mysql:
    container_name: db_mysql
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mvc-network
    volumes:
      - mysql_data:/var/lib/mysql

  mvc-server:
    build:
      context: .
    container_name: mvc-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      db_mysql:
        condition: service_healthy
    networks:
      - mvc-network

networks:
  mvc-network:
    driver: bridge

volumes:
  mysql_data:



