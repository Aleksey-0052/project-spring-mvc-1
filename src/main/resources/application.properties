# Local
spring.datasource.defaultUrl=jdbc:p6spy:mysql://localhost:3306/todo
# Docker
spring.datasource.dockerUrl=jdbc:p6spy:mysql://db_mysql:3306/todo

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
#spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml

# Перед запуском приложения через IDEA необходимо запустить контейнер: mysql
# Перед запуском приложения через docker необходимо остановить контейнер: mysql